<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>名前を入れてくれ</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #eee;
            padding-top: 80px;
        }
        input {
            font-size: 1.1em;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
        }
        button {
            font-size: 1.1em;
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: #8b7bff;
            color: #1a1a2e;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>名前を入れてくれ</h1>
    <form method="post">
        <input type="text" name="username" placeholder="お前の名前">
        <button type="submit">送信</button>
    </form>
</body>
</html>
