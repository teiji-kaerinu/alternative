<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>今の時刻</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #eee;
            padding-top: 80px;
        }
        .clock {
            font-size: 2.4em;
            color: #8b7bff;
            margin: 24px;
        }
        .note { color: #888; }
    </style>
</head>
<body>
    <h1>今の時刻はこれだ</h1>
    <p class="clock">{{ now }}</p>
    <p class="note">F5で更新するたびに変わるぞ。</p>
</body>
</html>
