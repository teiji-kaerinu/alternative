<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>足し算電卓</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #eee;
            padding-top: 80px;
        }
        input {
            font-size: 1.1em;
            padding: 8px;
            width: 90px;
            border-radius: 6px;
            border: none;
            text-align: center;
        }
        button {
            font-size: 1.1em;
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: #8b7bff;
            color: #1a1a2e;
            cursor: pointer;
        }
        .plus { font-size: 1.5em; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>足し算電卓</h1>
    <form method="post">
        <input type="number" name="num1" placeholder="1つ目">
        <span class="plus">+</span>
        <input type="number" name="num2" placeholder="2つ目">
        <br><br>
        <button type="submit">計算する</button>
    </form>
</body>
</html>
